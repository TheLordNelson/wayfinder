<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="description" content="Wayfinder — plan your journey, stop by stop." />
<title>Wayfinder</title>
<style>
  * { box-sizing: border-box; }
  html, body, #root { margin: 0; padding: 0; min-height: 100%; }
  body { background: #F6F1E4; -webkit-font-smoothing: antialiased; }
  button:focus-visible, input:focus-visible, textarea:focus-visible {
    outline: 2px solid #B8860B; outline-offset: 2px;
  }
  #loading { font-family: ui-sans-serif, system-ui, sans-serif; color: #3C5A78; padding: 40px 20px; text-align: center; }
</style>
</head>
<body>
<div id="root"><div id="loading">Loading Wayfinder…</div></div>

<script>
  window.__wferr = function (msg) {
    var r = document.getElementById("root");
    if (r) r.innerHTML =
      '<div style="font-family:ui-monospace,monospace;white-space:pre-wrap;padding:20px;color:#7a2b2b;font-size:13px;line-height:1.5">Wayfinder hit an error:\n\n' +
      String(msg).replace(/</g, "&lt;") + "</div>";
  };
  window.addEventListener("error", function (e) {
    window.__wferr((e.error && e.error.stack) || e.message || e);
  });
  window.addEventListener("unhandledrejection", function (e) {
    window.__wferr("Promise error: " + ((e.reason && e.reason.stack) || e.reason));
  });
  setTimeout(function () {
    var r = document.getElementById("root");
    if (r && /Loading Wayfinder/.test(r.textContent)) {
      if (typeof React === "undefined" || typeof ReactDOM === "undefined")
        window.__wferr("React did not load. The CDN scripts are likely blocked on this network or browser. Try a different browser (Safari/Chrome) or network.");
      else if (typeof Babel === "undefined")
        window.__wferr("The in-browser compiler (Babel) did not load from the CDN.");
      else
        window.__wferr("Scripts loaded but the app did not render within 9s. Screenshot this and any red text.");
    }
  }, 9000);
</script>

<script type="text/babel" data-presets="react">
const { useState, useMemo, useEffect, useRef } = React;

// ---- inline icon set (replaces lucide-react; same {size,color} props) ----
const S = ({ size = 20, color = "currentColor", children }) => (

const Plane = (p) => <S {...p}><path d="M17.8 19.2 16 11l3.5-3.5C21 6 21.5 4 21 3c-1-.5-3 0-4.5 1.5L13 8 4.8 6.2c-.5-.1-.9.1-1.1.5l-.3.5c-.2.5-.1 1 .3 1.3L9 12l-2 3H4l-1 1 3 2 2 3 1-1v-3l3-2 3.5 5.3c.3.4.8.5 1.3.3l.5-.2c.4-.3.6-.7.5-1.2z"/></S>;

const Users = (p) => <S {...p}><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></S>;

const ArrowUp = (p) => <S {...p}><path d="M12 19V5M5 12l7-7 7 7"/></S>;

const Home = (p) => <S {...p}><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M9 22V12h6v10"/></S>;
const MapPin = (p) => <S {...p}><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0z"/><circle cx="12" cy="10" r="3"/></S>;
const Folder = (p) => <S {...p}><path d="M4 20h16a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.69-.9l-.81-1.2A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2z"/></S>;
const X = (p) => <S {...p}><path d="M18 6 6 18M6 6l12 12"/></S>;
const Pencil = (p) => <S {...p}><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4z"/></S>;

const Upload = (p) => <S {...p}><path d="M12 21V9"/><path d="m7 14 5-5 5 5"/><path d="M5 3h14"/></S>;
const FilePlus = (p) => <S {...p}><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/><path d="M12 12v6M9 15h6"/></S>;
const Link2 = (p) => <S {...p}><path d="M9 17H7A5 5 0 0 1 7 7h2"/><path d="M15 7h2a5 5 0 0 1 0 10h-2"/><path d="M8 12h8"/></S>;


// ---- Brand tokens (inline styles — artifacts have no Tailwind JIT for arbitrary hex) ----
const INK = "#16324F";       // deep navy ink
const INK_SOFT = "#3C5A78";  // muted navy
const BRASS = "#B8860B";     // brass gold
const BRASS_DEEP = "#8C6608";
const SEA = "#2F7C86";       // ferry teal
const PAPER = "#F6F1E4";     // warm chart paper
const PAPER_2 = "#FBF8F0";
const LINE = "#E4DCC8";

const money = (n) => "$" + Math.round(n).toLocaleString("en-AU");
const uid = () => Math.random().toString(36).slice(2, 9);

// ---- saved-plans persistence (browser localStorage; works on any static host) ----
const PKEY = "wayfinder.plans.v1";
const AKEY = "wayfinder.active.v1";
function readPlans() {
  try {
    const raw = localStorage.getItem(PKEY);
    const plans = raw ? JSON.parse(raw) : [];
    const activeId = localStorage.getItem(AKEY) || null;
    return { plans: Array.isArray(plans) ? plans : [], activeId };
  } catch (e) { return { plans: [], activeId: null }; }
}
function writePlans(plans) { try { localStorage.setItem(PKEY, JSON.stringify(plans)); } catch (e) {} }
function writeActive(id) { try { if (id) localStorage.setItem(AKEY, id); } catch (e) {} }

function blankData() {
  return { travellers: 2, party: "Couple", vibe: [], stops: [], startDate: "", month: 6, flexible: true, cabin: "premium", tier: "comfortable", target: 20000 };
}
function nextName(plans) {
  const base = "Untitled plan";
  if (!plans.some((p) => p.name === base)) return base;
  let n = 2; while (plans.some((p) => p.name === base + " " + n)) n++;
  return base + " " + n;
}
function safeFile(name) {
  return (String(name || "plan").replace(/[^\w\-]+/g, "-").replace(/^-+|-+$/g, "").slice(0, 40) || "plan");
}
function relTime(ts) {
  if (!ts) return "";
  const s = Math.floor((Date.now() - ts) / 1000);
  if (s < 45) return "just now";
  const m = Math.floor(s / 60); if (m < 60) return m + " min ago";
  const h = Math.floor(m / 60); if (h < 24) return h + " h ago";
  const d = Math.floor(h / 24); if (d < 7) return d + " d ago";
  return new Date(ts).toLocaleDateString("en-AU", { day: "numeric", month: "short" });
}
function downloadJSON(filename, obj) {
  try {
    const blob = new Blob([JSON.stringify(obj, null, 2)], { type: "application/json" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = filename; document.body.appendChild(a); a.click();
    document.body.removeChild(a); setTimeout(() => URL.revokeObjectURL(url), 1000);
  } catch (e) { alert("Couldn't export: " + (e && e.message)); }
}

// ---- date scheduling (derive per-stop ranges from a single start date) ----
function computeSchedule(startDate, stops) {
  if (!startDate) return null;
  const start = new Date(startDate + "T00:00:00");
  if (isNaN(start.getTime())) return null;
  let cur = new Date(start);
  const rows = (stops || []).map((s) => {
    const arrive = new Date(cur);
    const depart = new Date(cur);
    depart.setDate(depart.getDate() + (s.nights || 0));
    cur = depart;
    return { id: s.id, arrive, depart };
  });
  return { rows, start, end: cur };
}
function fmtDay(d) { return d.getDate() + " " + MONTHS[d.getMonth()].slice(0, 3); }
function fmtDayY(d) { return d.getDate() + " " + MONTHS[d.getMonth()].slice(0, 3) + " " + d.getFullYear(); }
function fmtRange(a, b) {
  // a = arrive, b = depart (last night is the day before b)
  if (a.getMonth() === b.getMonth()) return a.getDate() + "–" + b.getDate() + " " + MONTHS[a.getMonth()].slice(0, 3);
  return fmtDay(a) + " – " + fmtDay(b);
}

// ---- URL-safe base64 for shareable links (UTF-8 safe) ----
function b64urlEncode(str) {
  const b64 = btoa(unescape(encodeURIComponent(str)));
  return b64.replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
}
function b64urlDecode(s) {
  s = s.replace(/-/g, "+").replace(/_/g, "/");
  while (s.length % 4) s += "=";
  return decodeURIComponent(escape(atob(s)));
}
function readSharedFromHash() {
  try {
    const m = (location.hash || "").match(/[#&]plan=([^&]+)/);
    if (!m) return null;
    const obj = JSON.parse(b64urlDecode(m[1]));
    const plan = obj && (obj.plan || (obj.data ? obj : null));
    if (plan && plan.data) return { name: plan.name, data: plan.data };
    return null;
  } catch (e) { return null; }
}

const MONTHS = ["January","February","March","April","May","June","July","August","September","October","November","December"];
const PEAK = new Set([5, 6, 7, 11]); // Jun, Jul, Aug, Dec (Aus school holidays / Euro peak)

const CABINS = [
  { id: "economy", label: "Economy", mult: 1.0 },
  { id: "premium", label: "Premium economy", mult: 1.75 },
  { id: "business", label: "Business", mult: 3.6 },
];
const TIERS = [
  { id: "comfortable", label: "Comfortable 3★", nightly: 270 },
  { id: "premium", label: "Premium 4★", nightly: 410 },
  { id: "luxury", label: "Luxury 5★", nightly: 660 },
];
const VIBES = ["Culture & sightseeing", "Beaches & scenery", "Food & wine", "Adventure", "Rest & recharge", "Local life & wandering"];

const SEED_STOPS = [
  { id: uid(), name: "Canterbury (Reynolds Farm)", nights: 5, mode: "plane", note: "Visiting family" },
  { id: uid(), name: "French Riviera (Nice)", nights: 4, mode: "plane", note: "" },
  { id: uid(), name: "Naples", nights: 2, mode: "plane", note: "" },
  { id: uid(), name: "Ischia", nights: 5, mode: "ferry", note: "" },
  { id: uid(), name: "Milos", nights: 3, mode: "plane", note: "" },
  { id: uid(), name: "Mykonos", nights: 2, mode: "ferry", note: "" },
];

function Wayfinder() {
  const [step, setStep] = useState(0);
  const [travellers, setTravellers] = useState(2);
  const [party, setParty] = useState("Couple");
  const [vibe, setVibe] = useState(["Culture & sightseeing", "Beaches & scenery"]);
  const [stops, setStops] = useState(SEED_STOPS);
  const [newStop, setNewStop] = useState("");
  const [month, setMonth] = useState(6); // legacy fallback; startDate is authoritative when set
  const [startDate, setStartDate] = useState("2027-07-05");
  const [flexible, setFlexible] = useState(true);
  const [cabin, setCabin] = useState("premium");
  const [tier, setTier] = useState("comfortable");
  const [target, setTarget] = useState(20000);
  const [copied, setCopied] = useState(false);

  // ---- saved plans ----
  const [plans, setPlans] = useState([]);
  const [activeId, setActiveId] = useState(null);
  const [view, setView] = useState("wizard"); // "wizard" | "plans"
  const [hydrated, setHydrated] = useState(false);
  const [renaming, setRenaming] = useState(null); // { id, name } | null
  const [savedFlash, setSavedFlash] = useState(false);
  const [shareMsg, setShareMsg] = useState("");
  const fileInputRef = useRef(null);

  const totalNights = useMemo(() => stops.reduce((a, s) => a + s.nights, 0), [stops]);
  const effMonth = useMemo(() => {
    if (!startDate) return month;
    const d = new Date(startDate + "T00:00:00");
    return isNaN(d.getTime()) ? month : d.getMonth();
  }, [startDate, month]);
  const sched = useMemo(() => computeSchedule(startDate, stops), [startDate, stops]);
  const isPeak = PEAK.has(effMonth);

  const cost = useMemo(() => {
    const cabinMult = (CABINS.find((c) => c.id === cabin) || CABINS[1]).mult;
    const nightly = (TIERS.find((t) => t.id === tier) || TIERS[0]).nightly;
    const season = isPeak ? 1.4 : 1.0;
    const legs = Math.max(0, stops.length - 1);
    const flights = travellers * 2200 * cabinMult * season;
    const intra = legs * travellers * 230;
    const accom = totalNights * nightly;
    const food = travellers * 90 * totalNights;
    const local = totalNights * 55;
    const exp = stops.length * 300;
    const total = flights + intra + accom + food + local + exp;
    return {
      rows: [
        { k: "Long-haul flights (" + travellers + " × " + (CABINS.find(c=>c.id===cabin)||{}).label.toLowerCase() + ")", v: flights },
        { k: "Flights & ferries within the trip", v: intra },
        { k: "Accommodation (" + totalNights + " nights)", v: accom },
        { k: "Food & drink", v: food },
        { k: "Local transport", v: local },
        { k: "Experiences & splurges", v: exp },
      ],
      total, low: total * 0.85, high: total * 1.2,
    };
  }, [travellers, cabin, tier, isPeak, stops.length, totalNights]);

  // ---- stop editing ----
  const setNights = (id, d) => setStops((s) => s.map((x) => x.id === id ? { ...x, nights: Math.max(1, x.nights + d) } : x));
  const rename = (id, name) => setStops((s) => s.map((x) => x.id === id ? { ...x, name } : x));
  const cycleMode = (id) => setStops((s) => s.map((x) => x.id === id ? { ...x, mode: x.mode === "plane" ? "ferry" : "plane" } : x));
  const remove = (id) => setStops((s) => s.filter((x) => x.id !== id));
  const move = (i, d) => setStops((s) => {
    const n = [...s]; const j = i + d;
    if (j < 0 || j >= n.length) return s;
    [n[i], n[j]] = [n[j], n[i]]; return n;
  });
  const add = () => {
    const name = newStop.trim();
    if (!name) return;
    setStops((s) => [...s, { id: uid(), name, nights: 3, mode: "plane", note: "" }]);
    setNewStop("");
  };

  const prompt = useMemo(() => buildPrompt({ travellers, party, vibe, stops, startDate, month: effMonth, flexible, cabin, tier, target, totalNights, cost }), [travellers, party, vibe, stops, startDate, effMonth, flexible, cabin, tier, target, totalNights, cost]);

  const doCopy = async () => {
    try {
      await navigator.clipboard.writeText(prompt);
      setCopied(true); setTimeout(() => setCopied(false), 1800);
    } catch {
      const ta = document.createElement("textarea");
      ta.value = prompt; document.body.appendChild(ta); ta.select();
      try { document.execCommand("copy"); setCopied(true); setTimeout(() => setCopied(false), 1800); } catch {}
      document.body.removeChild(ta);
    }
  };

  // ---- plan data snapshot & apply ----
  const planData = useMemo(() => ({
    travellers, party, vibe, stops, startDate, month, flexible, cabin, tier, target
  }), [travellers, party, vibe, stops, startDate, month, flexible, cabin, tier, target]);

  const applyPlan = (d) => {
    if (!d) return;
    setTravellers(typeof d.travellers === "number" ? d.travellers : 2);
    setParty(d.party || "Couple");
    setVibe(Array.isArray(d.vibe) ? d.vibe : []);
    setStops(Array.isArray(d.stops) ? d.stops.map((s) => ({ ...s, id: s.id || uid() })) : []);
    setStartDate(typeof d.startDate === "string" ? d.startDate : "");
    setMonth(typeof d.month === "number" ? d.month : 6);
    setFlexible(d.flexible !== false);
    setCabin(d.cabin || "premium");
    setTier(d.tier || "comfortable");
    setTarget(typeof d.target === "number" ? d.target : 20000);
  };

  const activePlan = plans.find((p) => p.id === activeId) || null;

  // load on first mount (and import a shared link if present in the URL)
  useEffect(() => {
    const stored = readPlans();
    let basePlans = stored.plans;
    if (!basePlans.length) {
      basePlans = [{ id: uid(), name: "Europe 2027", updatedAt: Date.now(), data: planData }];
    }
    const shared = readSharedFromHash();
    let openId, openData;
    if (shared) {
      const p = { id: uid(), name: shared.name || "Shared plan", updatedAt: Date.now(), data: shared.data };
      basePlans = [p, ...basePlans];
      openId = p.id; openData = p.data;
      try { history.replaceState(null, "", location.pathname + location.search); } catch (e) {}
    } else {
      const act = basePlans.find((p) => p.id === stored.activeId) || basePlans[0];
      openId = act.id; openData = act.data;
    }
    setPlans(basePlans);
    setActiveId(openId);
    applyPlan(openData);
    writePlans(basePlans); writeActive(openId);
    setHydrated(true);
    if (shared) setStep(2);
  }, []);

  // auto-save the active plan whenever its data changes (debounced)
  useEffect(() => {
    if (!hydrated || !activeId) return;
    const t = setTimeout(() => {
      setPlans((prev) => {
        const next = prev.map((p) => p.id === activeId ? { ...p, data: planData, updatedAt: Date.now() } : p);
        writePlans(next);
        return next;
      });
      setSavedFlash(true); setTimeout(() => setSavedFlash(false), 1200);
    }, 400);
    return () => clearTimeout(t);
  }, [planData, activeId, hydrated]);

  // persist which plan is active
  useEffect(() => { if (hydrated && activeId) writeActive(activeId); }, [activeId, hydrated]);

  // ---- plan actions ----
  const newPlan = () => {
    const p = { id: uid(), name: nextName(plans), updatedAt: Date.now(), data: blankData() };
    const next = [p, ...plans];
    setPlans(next); writePlans(next); writeActive(p.id);
    setActiveId(p.id); applyPlan(p.data);
    setView("wizard"); setStep(1);
    setRenaming({ id: p.id, name: p.name });
  };
  const openPlan = (id) => {
    const p = plans.find((x) => x.id === id); if (!p) return;
    setActiveId(id); applyPlan(p.data); writeActive(id);
    setView("wizard"); setStep(2);
  };
  const duplicatePlan = (id) => {
    const p = plans.find((x) => x.id === id); if (!p) return;
    const copy = { id: uid(), name: p.name + " (copy)", updatedAt: Date.now(), data: JSON.parse(JSON.stringify(p.data)) };
    const next = [copy, ...plans];
    setPlans(next); writePlans(next);
  };
  const renamePlan = (id, name) => {
    const nm = (name || "").trim() || "Untitled plan";
    const next = plans.map((p) => p.id === id ? { ...p, name: nm, updatedAt: Date.now() } : p);
    setPlans(next); writePlans(next);
  };
  const deletePlan = (id) => {
    const next = plans.filter((x) => x.id !== id);
    if (id === activeId) {
      if (next.length) { setActiveId(next[0].id); applyPlan(next[0].data); writeActive(next[0].id); }
      else {
        const p = { id: uid(), name: "Untitled plan", updatedAt: Date.now(), data: blankData() };
        next.push(p); setActiveId(p.id); applyPlan(p.data); writeActive(p.id);
      }
    }
    setPlans(next); writePlans(next);
  };
  const exportPlan = (id) => {
    const p = plans.find((x) => x.id === id); if (!p) return;
    downloadJSON(safeFile(p.name) + ".wayfinder.json", { type: "wayfinder-plan", version: 1, plan: p });
  };
  const exportAll = () => downloadJSON("wayfinder-plans.json", { type: "wayfinder-plans", version: 1, plans });
  const sharePlan = async (id) => {
    const p = plans.find((x) => x.id === id); if (!p) return;
    let url;
    try {
      const payload = { type: "wayfinder-plan", version: 1, plan: { name: p.name, data: p.data } };
      url = location.origin + location.pathname + "#plan=" + b64urlEncode(JSON.stringify(payload));
    } catch (e) { alert("Couldn't build a link for this plan."); return; }
    if (navigator.share) {
      try { await navigator.share({ title: p.name, text: "Wayfinder plan: " + p.name, url }); return; } catch (e) { /* user cancelled or unsupported — fall back to copy */ }
    }
    try {
      await navigator.clipboard.writeText(url);
      setShareMsg("Link copied to clipboard"); setTimeout(() => setShareMsg(""), 2200);
    } catch (e) {
      window.prompt("Copy this shareable link:", url);
    }
  };
  const onImportFile = (e) => {
    const file = e.target.files && e.target.files[0];
    e.target.value = "";
    if (!file) return;
    const r = new FileReader();
    r.onload = () => {
      try {
        const obj = JSON.parse(r.result);
        let incoming = [];
        if (obj && obj.type === "wayfinder-plans" && Array.isArray(obj.plans)) incoming = obj.plans;
        else if (obj && obj.type === "wayfinder-plan" && obj.plan) incoming = [obj.plan];
        else if (Array.isArray(obj)) incoming = obj;
        else if (obj && obj.data) incoming = [obj];
        else throw new Error("Unrecognised file format");
        const cleaned = incoming.filter((p) => p && p.data).map((p) => ({
          id: uid(), name: p.name || "Imported plan", updatedAt: Date.now(), data: p.data
        }));
        if (!cleaned.length) throw new Error("No plans found in file");
        const next = [...cleaned, ...plans];
        setPlans(next); writePlans(next);
        setActiveId(cleaned[0].id); applyPlan(cleaned[0].data); writeActive(cleaned[0].id);
        setView("wizard"); setStep(2);
      } catch (err) { alert("Import failed: " + (err && err.message)); }
    };
    r.readAsText(file);
  };

  const STEPS = ["Welcome", "Travellers", "Route & nights", "When", "Style", "Estimate", "Your prompt"];
  const go = (d) => setStep((s) => Math.min(STEPS.length - 1, Math.max(0, s + d)));

  return (
    <div style={{ background: PAPER, minHeight: "100vh", color: INK, fontFamily: "ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" }}>
      <div style={{ maxWidth: 560, margin: "0 auto", paddingBottom: 96 }}>

        {/* Header */}
        <header style={{ padding: "18px 20px 14px", borderBottom: "1px solid " + LINE }}>
          <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
            <div style={{ width: 34, height: 34, borderRadius: 8, background: INK, display: "grid", placeItems: "center", boxShadow: "0 1px 0 " + BRASS_DEEP }}>
              <Compass size={19} color={PAPER_2} />
            </div>
            <div>
              <div style={{ fontFamily: "Georgia, 'Times New Roman', serif", fontSize: 22, fontWeight: 700, letterSpacing: 0.5, lineHeight: 1 }}>Wayfinder</div>
              <div style={{ fontSize: 11.5, color: INK_SOFT, letterSpacing: 1.2, textTransform: "uppercase", marginTop: 3 }}>Plan your journey, stop by stop</div>
            </div>
            <button onClick={() => setView("plans")} aria-label="My plans"
              style={{ marginLeft: "auto", display: "inline-flex", alignItems: "center", gap: 6, background: PAPER_2, color: INK, border: "1px solid " + LINE, borderRadius: 10, padding: "8px 11px", fontSize: 13, fontWeight: 700, cursor: "pointer" }}>
              <Folder size={16} /> Plans
              {plans.length ? <span style={{ fontFamily: "ui-monospace, monospace", fontSize: 11, background: INK, color: PAPER_2, borderRadius: 999, padding: "1px 6px" }}>{plans.length}</span> : null}
            </button>
          </div>
          {activePlan && (
            <button onClick={() => setRenaming({ id: activePlan.id, name: activePlan.name })}
              style={{ display: "inline-flex", alignItems: "center", gap: 7, marginTop: 12, maxWidth: "100%", background: "transparent", border: "1px dashed " + LINE, borderRadius: 999, padding: "5px 12px", cursor: "pointer", color: INK }}>
              <MapPin size={13} color={BRASS_DEEP} />
              <span style={{ fontWeight: 700, fontSize: 13.5, whiteSpace: "nowrap", overflow: "hidden", textOverflow: "ellipsis" }}>{activePlan.name}</span>
              <Pencil size={12} color={INK_SOFT} />
              <span style={{ fontSize: 11, color: SEA, marginLeft: 2, minWidth: 46 }}>{savedFlash ? "saved ✓" : ""}</span>
            </button>
          )}
          {step > 0 && (
            <div style={{ display: "flex", gap: 6, marginTop: 14 }}>
              {STEPS.slice(1).map((s, i) => (
                <div key={s} title={s} style={{ height: 4, flex: 1, borderRadius: 2, background: i + 1 <= step ? BRASS : LINE, transition: "background .3s" }} />
              ))}
            </div>
          )}
        </header>

        <main style={{ padding: "20px" }}>

          {/* 0 — Welcome */}
          {step === 0 && (
            <section>
              <Eyebrow>A guided plan</Eyebrow>
              <h1 style={{ fontFamily: "Georgia, serif", fontSize: 30, lineHeight: 1.15, margin: "6px 0 12px", fontWeight: 700 }}>
                Build your holiday one stop at a time.
              </h1>
              <p style={{ color: INK_SOFT, fontSize: 15.5, lineHeight: 1.6, margin: "0 0 20px" }}>
                We'll shape it together in the right order — who's coming, where you'll go, how long at each stop, when you travel, and how you like to do it. Adjust anything as you go. At the end you'll get a ready-made brief to hand to Claude, who'll turn it into a full, costed itinerary.
              </p>
              <RouteMini stops={stops} />
              <button onClick={() => go(1)} style={primaryBtn}>
                Start planning <ChevronRight size={18} />
              </button>
            </section>
          )}

          {/* 1 — Travellers */}
          {step === 1 && (
            <section>
              <StepHead icon={<Users size={18} />} n="1" title="Who's travelling" />
              <Label>Party</Label>
              <ChipRow options={["Solo", "Couple", "Family", "Friends"]} value={party} onPick={setParty} />
              <div style={{ height: 18 }} />
              <Label>How many travellers</Label>
              <div style={{ display: "flex", alignItems: "center", gap: 14 }}>
                <Stepper onDown={() => setTravellers((v) => Math.max(1, v - 1))} onUp={() => setTravellers((v) => Math.min(12, v + 1))} value={travellers} />
                <span style={{ color: INK_SOFT, fontSize: 14 }}>{travellers === 1 ? "traveller" : "travellers"}</span>
              </div>
              <div style={{ height: 18 }} />
              <Label>The vibe <span style={{ color: INK_SOFT, fontWeight: 400 }}>(pick any)</span></Label>
              <div style={{ display: "flex", flexWrap: "wrap", gap: 8 }}>
                {VIBES.map((v) => {
                  const on = vibe.includes(v);
                  return (
                    <button key={v} onClick={() => setVibe((cur) => on ? cur.filter((x) => x !== v) : [...cur, v])}
                      style={{ ...chip, background: on ? INK : PAPER_2, color: on ? PAPER_2 : INK, borderColor: on ? INK : LINE }}>
                      {v}
                    </button>
                  );
                })}
              </div>
            </section>
          )}

          {/* 2 — Route & nights (the spine) */}
          {step === 2 && (
            <section>
              <StepHead icon={<MapPin size={18} />} n="2" title="Route & nights" />
              <p style={{ color: INK_SOFT, fontSize: 14, margin: "0 0 16px", lineHeight: 1.55 }}>
                Your route runs top to bottom. Adjust nights, reorder, rename or remove stops — tap the leg icon to switch a hop between flight and ferry.
              </p>
              <Spine stops={stops} dates={sched ? sched.rows : null} onNights={setNights} onMove={move} onRemove={remove} onRename={rename} onMode={cycleMode} />
              <div style={{ display: "flex", gap: 8, marginTop: 14 }}>
                <input value={newStop} onChange={(e) => setNewStop(e.target.value)} onKeyDown={(e) => e.key === "Enter" && add()}
                  placeholder="Add a stop…" style={inputStyle} />
                <button onClick={add} style={{ ...ghostBtn, paddingInline: 14 }}><Plus size={18} /></button>
              </div>
            </section>
          )}

          {/* 3 — When */}
          {step === 3 && (
            <section>
              <StepHead icon={<Calendar size={18} />} n="3" title="When do you travel" />
              <Label>Start date <span style={{ color: INK_SOFT, fontWeight: 400 }}>(arrive at your first stop)</span></Label>
              <input type="date" value={startDate} onChange={(e) => setStartDate(e.target.value)}
                style={{ ...inputStyle, fontFamily: "ui-monospace, monospace", maxWidth: 220 }} />
              {startDate && (
                <button onClick={() => setStartDate("")} style={{ ...ghostBtn, marginLeft: 8, padding: "9px 12px" }}>Clear</button>
              )}
              {sched ? (
                <div style={{ marginTop: 12, fontSize: 13.5, color: INK, background: PAPER_2, border: "1px solid " + LINE, borderRadius: 10, padding: "10px 12px", lineHeight: 1.6 }}>
                  Away <strong>{fmtDay(sched.start)}</strong> → last stop wraps up <strong>{fmtDay(sched.end)}</strong>
                  <span style={{ color: INK_SOFT }}> · {totalNights} nights on the ground</span>
                </div>
              ) : (
                <div style={{ marginTop: 12, fontSize: 13, color: INK_SOFT }}>Pick a start date to lay out arrival and departure dates for every stop.</div>
              )}
              <label style={{ display: "flex", alignItems: "center", gap: 10, marginTop: 18, fontSize: 14.5, cursor: "pointer" }}>
                <input type="checkbox" checked={flexible} onChange={(e) => setFlexible(e.target.checked)} style={{ width: 18, height: 18, accentColor: INK }} />
                My dates are flexible by a few days
              </label>
              {isPeak && (
                <Callout tone="warn">
                  <strong>{MONTHS[effMonth]} is peak season.</strong> Ferries run at their highest frequency, but long-haul fares and island prices hit their yearly high, and it's hot and busy. Booking early protects price and availability.
                </Callout>
              )}
              {!isPeak && (
                <Callout tone="good">
                  <strong>{MONTHS[effMonth]} is shoulder or off-peak.</strong> Expect calmer crowds and better fares — just double-check seasonal ferries, which thin out outside roughly April–October.
                </Callout>
              )}
            </section>
          )}

          {/* 4 — Style & budget */}
          {step === 4 && (
            <section>
              <StepHead icon={<Wallet size={18} />} n="4" title="Style & budget" />
              <Label>Long-haul cabin</Label>
              <ChipRow options={CABINS.map((c) => c.label)} value={(CABINS.find((c) => c.id === cabin) || {}).label} onPick={(l) => setCabin(CABINS.find((c) => c.label === l).id)} />
              <div style={{ height: 18 }} />
              <Label>Accommodation</Label>
              <ChipRow options={TIERS.map((t) => t.label)} value={(TIERS.find((t) => t.id === tier) || {}).label} onPick={(l) => setTier(TIERS.find((t) => t.label === l).id)} />
              <div style={{ height: 18 }} />
              <Label>Budget target (AUD, for {travellers})</Label>
              <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
                <span style={{ fontFamily: "ui-monospace, monospace", fontSize: 18, color: BRASS_DEEP }}>$</span>
                <input type="number" value={target} min={0} step={500} onChange={(e) => setTarget(Number(e.target.value) || 0)} style={{ ...inputStyle, fontFamily: "ui-monospace, monospace" }} />
              </div>
              <div style={{ display: "flex", gap: 8, marginTop: 10 }}>
                {[15000, 20000, 30000].map((p) => (
                  <button key={p} onClick={() => setTarget(p)} style={{ ...chip, fontFamily: "ui-monospace, monospace", background: target === p ? INK : PAPER_2, color: target === p ? PAPER_2 : INK, borderColor: target === p ? INK : LINE }}>
                    {money(p)}
                  </button>
                ))}
              </div>
            </section>
          )}

          {/* 5 — Estimate */}
          {step === 5 && (
            <section>
              <StepHead icon={<Sparkles size={18} />} n="5" title="Rough cost estimate" />
              <p style={{ color: INK_SOFT, fontSize: 13.5, margin: "0 0 14px" }}>Ballpark planning ranges for {travellers} — not quotes. They shift with your choices.</p>
              <div style={{ border: "1px solid " + LINE, borderRadius: 12, overflow: "hidden", background: PAPER_2 }}>
                {cost.rows.map((r, i) => (
                  <div key={r.k} style={{ display: "flex", justifyContent: "space-between", gap: 12, padding: "11px 14px", borderTop: i ? "1px solid " + LINE : "none", fontSize: 14 }}>
                    <span style={{ color: INK_SOFT }}>{r.k}</span>
                    <span style={{ fontFamily: "ui-monospace, monospace" }}>{money(r.v)}</span>
                  </div>
                ))}
                <div style={{ display: "flex", justifyContent: "space-between", gap: 12, padding: "13px 14px", borderTop: "2px solid " + INK, background: PAPER, fontWeight: 700 }}>
                  <span>Indicative total</span>
                  <span style={{ fontFamily: "ui-monospace, monospace" }}>{money(cost.low)} – {money(cost.high)}</span>
                </div>
              </div>
              <BudgetVerdict low={cost.low} high={cost.high} target={target} cabin={cabin} />
            </section>
          )}

          {/* 6 — Prompt */}
          {step === 6 && (
            <section>
              <StepHead icon={<Compass size={18} />} n="6" title="Your planning brief" />
              <p style={{ color: INK_SOFT, fontSize: 14, margin: "0 0 12px", lineHeight: 1.55 }}>
                Here's your trip written up as a brief for Claude. Copy it into a chat and Claude will sequence the route, validate the transport, plan your days, and cost it out.
              </p>
              <div style={{ display: "flex", gap: 8, flexWrap: "wrap", marginBottom: 12 }}>
                <button onClick={doCopy} style={primaryBtn}>
                  {copied ? <><Check size={18} /> Copied</> : <><Copy size={18} /> Copy brief</>}
                </button>
                <button onClick={() => activeId && exportPlan(activeId)} style={ghostBtn} title="Download a backup of this plan">
                  <Download size={16} /> Export plan
                </button>
                <button onClick={() => activeId && sharePlan(activeId)} style={ghostBtn} title="Copy a link that opens this plan">
                  <Link2 size={16} /> Share link
                </button>
              </div>
              <textarea readOnly value={prompt} style={{ width: "100%", height: 300, resize: "vertical", padding: 14, border: "1px solid " + LINE, borderRadius: 12, background: PAPER_2, color: INK, fontFamily: "ui-monospace, monospace", fontSize: 12.5, lineHeight: 1.55, boxSizing: "border-box" }} />
            </section>
          )}
        </main>
      </div>

      {/* Sticky footer */}
      {step > 0 && (
      <footer style={{ position: "fixed", bottom: 0, left: 0, right: 0, borderTop: "1px solid " + LINE, background: PAPER_2, backdropFilter: "blur(6px)" }}>
        <div style={{ maxWidth: 560, margin: "0 auto", padding: "10px 20px", display: "flex", alignItems: "center", gap: 12 }}>
          {step >= 2 && (
            <div style={{ display: "flex", flexDirection: "column", lineHeight: 1.15 }}>
              <span style={{ fontFamily: "ui-monospace, monospace", fontSize: 16, fontWeight: 700 }}>{totalNights} nights</span>
              <span style={{ fontSize: 11.5, color: INK_SOFT }}>{money(cost.low)}–{money(cost.high)} · {stops.length} stops</span>
            </div>
          )}
          <div style={{ marginLeft: "auto", display: "flex", gap: 8 }}>
            {step > 0 && <button onClick={() => go(-1)} style={ghostBtn}><ChevronLeft size={18} /> Back</button>}
            {step > 0 && step < 6 && <button onClick={() => go(1)} style={primaryBtn}>Next <ChevronRight size={18} /></button>}
            {step === 6 && <button onClick={doCopy} style={primaryBtn}>{copied ? <><Check size={18}/> Copied</> : <><Copy size={18} /> Copy</>}</button>}
          </div>
        </div>
      </footer>
      )}

      {/* hidden import file input */}
      <input ref={fileInputRef} type="file" accept="application/json,.json" onChange={onImportFile} style={{ display: "none" }} />

      {/* Plans overlay */}
      {view === "plans" && (
        <PlansScreen
          plans={plans} activeId={activeId}
          onClose={() => setView("wizard")}
          onOpen={openPlan} onNew={newPlan} onDuplicate={duplicatePlan}
          onDelete={deletePlan} onRename={(id, name) => setRenaming({ id, name })}
          onExport={exportPlan} onExportAll={exportAll} onShare={sharePlan}
          onImport={() => fileInputRef.current && fileInputRef.current.click()}
        />
      )}

      {/* Rename / name modal */}
      {renaming && (
        <NameModal
          initial={renaming.name}
          onCancel={() => setRenaming(null)}
          onSave={(name) => { renamePlan(renaming.id, name); setRenaming(null); }}
        />
      )}

      {/* Share toast */}
      {shareMsg && (
        <div style={{ position: "fixed", left: "50%", bottom: 84, transform: "translateX(-50%)", zIndex: 70, background: INK, color: PAPER_2, borderRadius: 999, padding: "9px 16px", fontSize: 13.5, fontWeight: 600, boxShadow: "0 4px 14px rgba(22,50,79,0.25)", display: "inline-flex", alignItems: "center", gap: 7 }}>
          <Check size={15} /> {shareMsg}
        </div>
      )}
    </div>
  );
}

// ---------- prompt builder ----------
function buildPrompt({ travellers, party, vibe, stops, startDate, month, flexible, cabin, tier, target, totalNights, cost }) {
  const cabinLabel = (CABINS.find((c) => c.id === cabin) || {}).label;
  const tierLabel = (TIERS.find((t) => t.id === tier) || {}).label;
  const sched = computeSchedule(startDate, stops);
  const routeLines = stops.map((s, i) => {
    const r = sched && sched.rows[i];
    const dates = r ? `  [${fmtRange(r.arrive, r.depart)}]` : "";
    return `  ${i + 1}. ${s.name} — ${s.nights} night${s.nights > 1 ? "s" : ""}${s.mode === "ferry" ? " (arrive by ferry)" : ""}${dates}${s.note ? ` (${s.note})` : ""}`;
  }).join("\n");
  const whenLine = sched
    ? `- Start: ${fmtDayY(sched.start)} (arrive first stop), last stop ends ${fmtDayY(sched.end)}${flexible ? " — dates flexible by a few days" : ""}`
    : `- Departure: ${MONTHS[month]}${flexible ? " (dates flexible by a few days)" : ""}`;
  return (
`You're my travel planner. Help me build a detailed, well-sequenced holiday itinerary, one layer at a time, and let me adjust as we go.

Please work in this order, checking in before moving on:
1. Sequence my route so we never backtrack.
2. Validate the real flights and ferries between each stop (flag anything seasonal or awkward).
3. Flag any stop where the nights look too short once travel days are counted.
4. Note peak-season cost, heat or crowd implications for my dates.
5. Give a rough AUD cost estimate and tell me if I'm over my target — with levers to get back under.
Hold off on suggesting daily activities until I've told you what I enjoy at each stop.

WHO
- ${travellers} traveller${travellers > 1 ? "s" : ""} (${party.toLowerCase()})
- Trip vibe: ${vibe.join(", ") || "open"}

WHEN
${whenLine}

ROUTE & NIGHTS (${totalNights} nights total)
${routeLines}

STYLE & BUDGET
- Long-haul cabin: ${cabinLabel}
- Accommodation: ${tierLabel}, self-catering where it suits
- Budget target: ${money(target)} for ${travellers}
- My own rough estimate so far: ${money(cost.low)}–${money(cost.high)}

Please build from here, flag anything that won't work, keep it easy to adjust, and produce a clean day-by-day plan once we've settled the details.`
  );
}

// ---------- small components ----------
function Eyebrow({ children }) {
  return <div style={{ fontSize: 11.5, letterSpacing: 1.6, textTransform: "uppercase", color: BRASS_DEEP, fontWeight: 700 }}>{children}</div>;
}
function StepHead({ icon, n, title }) {
  return (
    <div style={{ display: "flex", alignItems: "center", gap: 10, marginBottom: 14 }}>
      <div style={{ width: 30, height: 30, borderRadius: 8, background: INK, color: PAPER_2, display: "grid", placeItems: "center" }}>{icon}</div>
      <div style={{ fontFamily: "Georgia, serif", fontSize: 21, fontWeight: 700 }}>{title}</div>
      <div style={{ marginLeft: "auto", fontFamily: "ui-monospace, monospace", fontSize: 12, color: INK_SOFT, letterSpacing: 1 }}>0{n} / 06</div>
    </div>
  );
}
function Label({ children }) {
  return <div style={{ fontSize: 13, fontWeight: 700, marginBottom: 8, letterSpacing: 0.2 }}>{children}</div>;
}
function ChipRow({ options, value, onPick }) {
  return (
    <div style={{ display: "flex", flexWrap: "wrap", gap: 8 }}>
      {options.map((o) => (
        <button key={o} onClick={() => onPick(o)} style={{ ...chip, background: value === o ? INK : PAPER_2, color: value === o ? PAPER_2 : INK, borderColor: value === o ? INK : LINE }}>{o}</button>
      ))}
    </div>
  );
}
function Stepper({ onDown, onUp, value }) {
  return (
    <div style={{ display: "inline-flex", alignItems: "center", border: "1px solid " + LINE, borderRadius: 10, overflow: "hidden", background: PAPER_2 }}>
      <button onClick={onDown} style={stepBtn} aria-label="decrease"><Minus size={16} /></button>
      <span style={{ minWidth: 36, textAlign: "center", fontFamily: "ui-monospace, monospace", fontSize: 16, fontWeight: 700 }}>{value}</span>
      <button onClick={onUp} style={stepBtn} aria-label="increase"><Plus size={16} /></button>
    </div>
  );
}
function Callout({ tone, children }) {
  const c = tone === "warn" ? BRASS_DEEP : SEA;
  const bg = tone === "warn" ? "#FBF3DE" : "#E8F2F1";
  return <div style={{ marginTop: 16, padding: "12px 14px", borderRadius: 10, background: bg, borderLeft: "3px solid " + c, fontSize: 13.5, lineHeight: 1.55, color: INK }}>{children}</div>;
}
function BudgetVerdict({ low, high, target, cabin }) {
  const mid = (low + high) / 2;
  const over = mid > target;
  return (
    <div style={{ marginTop: 16 }}>
      <Callout tone={over ? "warn" : "good"}>
        {over ? (
          <>Your midpoint (~{money(mid)}) sits above your {money(target)} target. Biggest lever: {cabin !== "economy" ? "fly economy long-haul (saves a few thousand for two)" : "trim nights or drop to comfortable stays"}, then choose simpler accommodation or shave a night or two.</>
        ) : (
          <>You're tracking within your {money(target)} target — nice. Room to add a splurge or two if you'd like.</>
        )}
      </Callout>
    </div>
  );
}

// ---------- route spine (signature element) ----------
function Spine({ stops, dates, onNights, onMove, onRemove, onRename, onMode }) {
  return (
    <div>
      <Leg label="from home" mode="plane" first />
      {stops.map((s, i) => (
        <div key={s.id}>
          {i > 0 && <Leg label={s.mode === "ferry" ? "ferry" : "fly"} mode={s.mode} onClick={() => onMode(s.id)} />}
          <StopNode s={s} i={i} last={i === stops.length - 1} range={dates && dates[i]} onNights={onNights} onMove={onMove} onRemove={onRemove} onRename={onRename} />
        </div>
      ))}
      <Leg label="home" mode="plane" terminal />
    </div>
  );
}
function Leg({ label, mode, first, terminal, onClick }) {
  const Icon = mode === "ferry" ? Ship : (first || terminal ? Home : Plane);
  const showHome = first || terminal;
  return (
    <div style={{ display: "flex", alignItems: "center", gap: 10, paddingLeft: 15, height: 34 }}>
      <div style={{ width: 2, height: "100%", background: LINE }} />
      <button onClick={onClick} disabled={!onClick} style={{ display: "flex", alignItems: "center", gap: 6, border: "none", background: "transparent", cursor: onClick ? "pointer" : "default", color: showHome ? INK_SOFT : (mode === "ferry" ? SEA : INK_SOFT), fontSize: 11.5, letterSpacing: 0.5, textTransform: "uppercase", padding: 0 }}>
        {showHome ? <Home size={14} /> : <Icon size={14} />}
        {label}{onClick && <span style={{ fontSize: 10, opacity: 0.6 }}>(tap to switch)</span>}
      </button>
    </div>
  );
}
function StopNode({ s, i, last, range, onNights, onMove, onRemove, onRename }) {
  return (
    <div style={{ display: "flex", gap: 10, alignItems: "stretch" }}>
      {/* rail + node */}
      <div style={{ position: "relative", width: 32, display: "flex", justifyContent: "center" }}>
        <div style={{ position: "absolute", top: 0, bottom: 0, width: 2, background: LINE }} />
        <div style={{ position: "relative", marginTop: 16, width: 16, height: 16, borderRadius: 8, background: BRASS, border: "3px solid " + PAPER, boxShadow: "0 0 0 1px " + BRASS_DEEP, zIndex: 1 }} />
      </div>
      {/* card */}
      <div style={{ flex: 1, background: PAPER_2, border: "1px solid " + LINE, borderRadius: 12, padding: "10px 12px", marginBottom: 2 }}>
        <div style={{ display: "flex", alignItems: "center", gap: 6 }}>
          <input value={s.name} onChange={(e) => onRename(s.id, e.target.value)}
            style={{ flex: 1, border: "none", background: "transparent", fontSize: 15, fontWeight: 700, color: INK, padding: 0, outline: "none" }} />
          <button onClick={() => onMove(i, -1)} style={iconMini} aria-label="move up"><ArrowUp size={14} /></button>
          <button onClick={() => onMove(i, 1)} style={iconMini} aria-label="move down"><ArrowDown size={14} /></button>
          <button onClick={() => onRemove(s.id)} style={{ ...iconMini, color: "#A24A3A" }} aria-label="remove"><Trash2 size={14} /></button>
        </div>
        {s.note ? <div style={{ fontSize: 12, color: SEA, marginTop: 2 }}>{s.note}</div> : null}
        <div style={{ display: "flex", alignItems: "center", gap: 10, marginTop: 8, flexWrap: "wrap" }}>
          <div style={{ display: "inline-flex", alignItems: "center", border: "1px solid " + LINE, borderRadius: 8, overflow: "hidden" }}>
            <button onClick={() => onNights(s.id, -1)} style={{ ...stepBtn, padding: "5px 9px" }}><Minus size={14} /></button>
            <span style={{ minWidth: 46, textAlign: "center", fontFamily: "ui-monospace, monospace", fontSize: 13.5, fontWeight: 700 }}>{s.nights} nt</span>
            <button onClick={() => onNights(s.id, 1)} style={{ ...stepBtn, padding: "5px 9px" }}><Plus size={14} /></button>
          </div>
          {range && (
            <span style={{ display: "inline-flex", alignItems: "center", gap: 5, fontSize: 12.5, fontWeight: 700, color: INK, background: PAPER, border: "1px solid " + LINE, borderRadius: 999, padding: "4px 10px" }}>
              <Calendar size={12} color={BRASS_DEEP} /> {fmtRange(range.arrive, range.depart)}
            </span>
          )}
        </div>
      </div>
    </div>
  );
}
function RouteMini({ stops }) {
  return (
    <div style={{ display: "flex", flexWrap: "wrap", gap: 6, alignItems: "center", padding: "12px 14px", border: "1px dashed " + LINE, borderRadius: 12, background: PAPER_2, marginBottom: 20 }}>
      {stops.map((s, i) => (
        <React.Fragment key={s.id}>
          <span style={{ fontSize: 12.5, fontWeight: 600 }}>{s.name.split(" (")[0]}</span>
          {i < stops.length - 1 && (s.mode === "ferry" ? <Ship size={13} color={SEA} /> : <Plane size={13} color={INK_SOFT} />)}
        </React.Fragment>
      ))}
    </div>
  );
}

// ---------- saved-plans UI ----------
function PlansScreen({ plans, activeId, onClose, onOpen, onNew, onDuplicate, onDelete, onRename, onExport, onExportAll, onShare, onImport }) {
  return (
    <div style={{ position: "fixed", inset: 0, background: PAPER, zIndex: 50, overflowY: "auto" }}>
      <div style={{ maxWidth: 560, margin: "0 auto", minHeight: "100%" }}>
        <header style={{ position: "sticky", top: 0, background: PAPER, borderBottom: "1px solid " + LINE, padding: "16px 20px", display: "flex", alignItems: "center", gap: 10, zIndex: 1 }}>
          <div style={{ fontFamily: "Georgia, serif", fontSize: 22, fontWeight: 700 }}>My plans</div>
          <button onClick={onClose} aria-label="Close" style={{ marginLeft: "auto", display: "grid", placeItems: "center", width: 34, height: 34, borderRadius: 8, border: "1px solid " + LINE, background: PAPER_2, cursor: "pointer", color: INK }}><X size={18} /></button>
        </header>
        <div style={{ padding: "16px 20px", display: "flex", gap: 8, flexWrap: "wrap" }}>
          <button onClick={onNew} style={primaryBtn}><FilePlus size={18} /> New plan</button>
          <button onClick={onImport} style={ghostBtn}><Upload size={16} /> Import</button>
          {plans.length > 1 && <button onClick={onExportAll} style={ghostBtn}><Download size={16} /> Export all</button>}
        </div>
        <div style={{ padding: "0 20px 48px", display: "flex", flexDirection: "column", gap: 12 }}>
          {plans.length === 0 && (
            <div style={{ color: INK_SOFT, fontSize: 14, padding: "20px 0" }}>No saved plans yet. Tap “New plan” to start one.</div>
          )}
          {plans.map((p) => (
            <PlanCard key={p.id} p={p} active={p.id === activeId}
              onOpen={() => onOpen(p.id)}
              onDuplicate={() => onDuplicate(p.id)}
              onDelete={() => { if (window.confirm("Delete “" + p.name + "”? This can’t be undone.")) onDelete(p.id); }}
              onRename={() => onRename(p.id, p.name)}
              onExport={() => onExport(p.id)}
              onShare={() => onShare(p.id)} />
          ))}
        </div>
      </div>
    </div>
  );
}
function PlanCard({ p, active, onOpen, onDuplicate, onDelete, onRename, onExport, onShare }) {
  const d = p.data || {};
  const stops = Array.isArray(d.stops) ? d.stops : [];
  const nights = stops.reduce((a, s) => a + (s.nights || 0), 0);
  const route = stops.map((s) => (s.name || "").split(" (")[0]).filter(Boolean).join(" · ") || "No stops yet";
  return (
    <div style={{ border: "1px solid " + (active ? BRASS : LINE), borderRadius: 14, background: PAPER_2, padding: 14, boxShadow: active ? "0 0 0 1px " + BRASS : "none" }}>
      <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
        <div style={{ fontWeight: 700, fontSize: 16, fontFamily: "Georgia, serif", overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{p.name}</div>
        {active && <span style={{ fontSize: 10.5, textTransform: "uppercase", letterSpacing: 1, color: BRASS_DEEP, border: "1px solid " + BRASS, borderRadius: 999, padding: "1px 7px", whiteSpace: "nowrap" }}>Current</span>}
        <span style={{ marginLeft: "auto", fontSize: 11.5, color: INK_SOFT, whiteSpace: "nowrap" }}>{relTime(p.updatedAt)}</span>
      </div>
      <div style={{ fontSize: 13, color: INK_SOFT, marginTop: 6, lineHeight: 1.5 }}>{route}</div>
      <div style={{ fontFamily: "ui-monospace, monospace", fontSize: 12, color: INK_SOFT, marginTop: 6 }}>{nights} nights · {stops.length} stop{stops.length === 1 ? "" : "s"}</div>
      <div style={{ display: "flex", gap: 8, marginTop: 12, flexWrap: "wrap" }}>
        <button onClick={onOpen} style={{ ...primaryBtn, padding: "9px 14px", fontSize: 14 }}>{active ? "Continue" : "Open"} <ChevronRight size={16} /></button>
        <button onClick={onRename} style={pcBtn} aria-label="Rename"><Pencil size={15} /></button>
        <button onClick={onShare} style={pcBtn} aria-label="Share link"><Link2 size={15} /></button>
        <button onClick={onDuplicate} style={pcBtn} aria-label="Duplicate"><Copy size={15} /></button>
        <button onClick={onExport} style={pcBtn} aria-label="Export"><Download size={15} /></button>
        <button onClick={onDelete} style={{ ...pcBtn, color: "#A24A3A" }} aria-label="Delete"><Trash2 size={15} /></button>
      </div>
    </div>
  );
}
const pcBtn = { display: "grid", placeItems: "center", width: 40, height: 40, borderRadius: 10, border: "1px solid " + LINE, background: PAPER, cursor: "pointer", color: INK_SOFT };

function NameModal({ initial, onCancel, onSave }) {
  const [val, setVal] = useState(initial || "");
  return (
    <div onClick={onCancel} style={{ position: "fixed", inset: 0, background: "rgba(22,50,79,0.35)", zIndex: 60, display: "grid", placeItems: "center", padding: 20 }}>
      <div onClick={(e) => e.stopPropagation()} style={{ width: "100%", maxWidth: 380, background: PAPER, border: "1px solid " + LINE, borderRadius: 16, padding: 18 }}>
        <div style={{ fontFamily: "Georgia, serif", fontSize: 18, fontWeight: 700, marginBottom: 12 }}>Name this plan</div>
        <input autoFocus value={val} onChange={(e) => setVal(e.target.value)} onKeyDown={(e) => e.key === "Enter" && onSave(val)}
          placeholder="e.g. Europe 2027" style={{ ...inputStyle, width: "100%" }} />
        <div style={{ display: "flex", gap: 8, justifyContent: "flex-end", marginTop: 16 }}>
          <button onClick={onCancel} style={ghostBtn}>Cancel</button>
          <button onClick={() => onSave(val)} style={primaryBtn}>Save</button>
        </div>
      </div>
    </div>
  );
}

// ---------- inline style objects ----------
const primaryBtn = { display: "inline-flex", alignItems: "center", justifyContent: "center", gap: 8, background: INK, color: PAPER_2, border: "none", borderRadius: 10, padding: "11px 18px", fontSize: 15, fontWeight: 700, cursor: "pointer", width: "auto" };
const ghostBtn = { display: "inline-flex", alignItems: "center", gap: 4, background: PAPER_2, color: INK, border: "1px solid " + LINE, borderRadius: 10, padding: "9px 12px", fontSize: 14, fontWeight: 600, cursor: "pointer" };
const chip = { border: "1px solid " + LINE, borderRadius: 999, padding: "8px 14px", fontSize: 13.5, fontWeight: 600, cursor: "pointer", transition: "all .15s" };
const stepBtn = { display: "grid", placeItems: "center", background: "transparent", border: "none", padding: "8px 12px", cursor: "pointer", color: INK };
const iconMini = { display: "grid", placeItems: "center", background: "transparent", border: "none", padding: 4, cursor: "pointer", color: INK_SOFT };
const inputStyle = { flex: 1, width: "100%", border: "1px solid " + LINE, borderRadius: 10, padding: "10px 12px", fontSize: 15, color: INK, background: PAPER_2, boxSizing: "border-box", outline: "none" };

try {
  const root = ReactDOM.createRoot(document.getElementById("root"));
  root.render(<Wayfinder />);
} catch (e) {
  window.__wferr((e && e.stack) || e);
}
</script>
</body>
</html>
